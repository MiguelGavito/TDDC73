
name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-native-lint:
    name: React Native - ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/react-native

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/react-native/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  flutter-lint:
    name: Flutter - Dart Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Dart Analyzer
        run: flutter analyze --fatal-infos

  kotlin-lint:
    name: Kotlin - ktlint and Detekt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/kotlin-compose

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ktlint and Detekt
        run: ./gradlew ktlintCheck detekt
